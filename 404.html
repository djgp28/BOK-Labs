<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>404 — BOK Labs</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0A0A; --text: #F4F4F5; --text-2: #A1A1AA; --text-3: #52525B;
    --green: #1F5C3F; --green-active: #3DBA7E; --border: #262626;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    background-image:
      radial-gradient(900px 600px at 90% 0%, rgba(31,92,63,0.18), transparent 60%),
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 100% 100%, 56px 56px, 56px 56px;
    min-height: 100vh;
    display: grid; place-items: center;
  }
  main {
    max-width: 520px; padding: 40px 32px; text-align: left;
  }
  .eyebrow {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px; color: var(--green-active);
    letter-spacing: 0.18em; text-transform: uppercase;
    display: inline-flex; align-items: center; gap: 10px;
    margin-bottom: 20px;
  }
  .eyebrow::before { content: ''; width: 16px; height: 1px; background: var(--green-active); }
  h1 {
    font-weight: 700; font-size: 72px; letter-spacing: -0.04em;
    line-height: 0.95; margin: 0 0 18px;
  }
  h1 span { color: var(--text-2); }
  p {
    font-size: 16px; color: var(--text-2); line-height: 1.55;
    margin: 0 0 32px;
  }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  a.btn {
    background: var(--green); color: var(--text);
    padding: 12px 18px; border-radius: 6px;
    font-weight: 600; font-size: 14px; text-decoration: none;
    display: inline-flex; align-items: center; gap: 8px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 1px 0 rgba(0,0,0,0.4);
  }
  a.ghost {
    background: transparent; border: 1px solid #303030; color: var(--text);
    padding: 12px 18px; border-radius: 6px;
    font-weight: 500; font-size: 14px; text-decoration: none;
  }
  code {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 12px; color: var(--text-3);
    margin-top: 24px; display: block;
  }
</style>
</head>
<body>
<main>
  <div class="eyebrow">// error · 404</div>
  <h1>Page<br/><span>not</span><br/>found.</h1>
  <p>That route doesn't exist — or it was retired. Head back to the start, or drop us a note if you got here from somewhere on our site.</p>
  <div class="actions">
    <a class="btn" href="/">Back home <span style="font-family:'JetBrains Mono',monospace">→</span></a>
    <a class="ghost" href="mailto:info@bok-labs.com">Email us</a>
  </div>
  <code>// HTTP 404 · request was not routed</code>
</main>
</body>
</html>
